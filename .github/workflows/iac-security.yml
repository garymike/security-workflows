name: IaC security (reusable)

# Infrastructure-as-Code / misconfiguration scanning with the pinned iac-toolbox image
# (Checkov). Emits SARIF and uploads it to GitHub code scanning.

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to scan (default: repo root)'
        type: string
        default: '.'
      framework:
        description: 'Checkov frameworks (comma-separated) or "all"'
        type: string
        default: 'all'
      fail-on-findings:
        description: 'Fail the job on Checkov findings (false = warn only)'
        type: boolean
        default: false
      upload-sarif:
        description: 'Upload results to GitHub code scanning'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  iac-security:
    name: IaC security (Checkov)
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes. This workflow is reusable,
    # so one wedged job spends a caller's quota, not ours.
    # 2.5x the worst of five observed runs (35s), rounded up.
    timeout-minutes: 2
    permissions:
      contents: read
      packages: read          # pull the pinned scanner image from GHCR
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR (to pull the pinned image)
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Checkov scan
        id: checkov
        env:
          # Pinned by digest, not :latest, to match security-scan.yml. A toolbox
          # rebuild otherwise changes what every caller scans with, without any
          # caller changing a line. Bump deliberately, alongside toolbox/tools.lock.
          IMAGE: ghcr.io/garymike/security-workflows/iac-toolbox@sha256:d55bcbf3e8e0197e0cfac42e5bcad7fd6d12ea810eaa24ed557168a69c4cd07b
          SCAN_PATH: ${{ inputs.path }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -uo pipefail
          docker pull "$IMAGE"
          mkdir -p out && chmod 777 out
          rc=0
          # Checkov's stdout isn't clean SARIF (it prints a banner), so write to a file via
          # --output-file-path. chmod 777 lets the container's unprivileged user write there.
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/out:/out" -w /src "$IMAGE" \
            checkov -d "/src/$SCAN_PATH" --framework "$FRAMEWORK" --compact --quiet --output sarif --output-file-path /out || rc=$?
          sarif=false; [ -s out/results_sarif.sarif ] && sarif=true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
          echo "checkov finished (rc=$rc; non-zero = findings)"

      - name: Drop suppressed results from the SARIF
        # Checkov honours an inline `# checkov:skip=CKV_...: reason` when it scans (the
        # summary says "Skipped: 1"), but it still writes the finding into the SARIF, as a
        # result carrying an `inSource` suppression. GitHub code scanning does not honour
        # SARIF suppressions, so every upload re-asserted the alert: two CKV_DOCKER_2 alerts
        # on security-agents sat open from 2026-07-09 to 2026-11-12 with the skip comment in
        # place the whole time. Remove suppressed results here, so an inline skip means in
        # code scanning what it means in Checkov. A `skip-check` in .checkov.yaml never
        # reaches the SARIF and is unaffected.
        if: ${{ steps.checkov.outputs.sarif == 'true' }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "out/results_sarif.sarif"
          with open(path, encoding="utf-8") as handle:
              doc = json.load(handle)
          dropped = 0
          for run in doc.get("runs", []):
              results = run.get("results", [])
              kept = [r for r in results if not r.get("suppressions")]
              dropped += len(results) - len(kept)
              run["results"] = kept
          # The container's user owns the file; the directory is ours, so replace rather
          # than rewrite in place.
          with open(path + ".tmp", "w", encoding="utf-8") as handle:
              json.dump(doc, handle)
          os.replace(path + ".tmp", path)
          print(f"dropped {dropped} suppressed result(s) from {path}")
          PY

      - name: Upload SARIF to code scanning
        if: ${{ inputs.upload-sarif && steps.checkov.outputs.sarif == 'true' }}
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: out/results_sarif.sarif
          category: checkov

      - name: Enforce fail-on-findings
        if: ${{ inputs.fail-on-findings && steps.checkov.outputs.rc != '0' }}
        run: |
          echo "::error::Checkov reported findings (fail-on-findings=true)."
          exit 1
