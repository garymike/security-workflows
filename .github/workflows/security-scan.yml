name: Security scan (reusable)

on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: 'Fail the workflow if secrets are detected (false = warn only)'
        type: boolean
        default: true
      secret-scan:
        description: >-
          Run the betterleaks secret scan (false = skip it). For callers that already gate
          every change on an equivalent scan of their own. The action-pinning and SECURITY.md
          checks run either way.
        type: boolean
        default: true
      runner:
        description: >-
          Runner for the job: a label (default ubuntu-latest) or a JSON array of labels such
          as ["self-hosted","ci-apps"]. The job checks out and scans PR code, so point it only
          at a disposable, credential-free runner. See "Can I run it on a self-hosted runner?"
          in the README.
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read

# A single job with sequential steps. Each job on a private repo bills a 1-minute
# floor and re-runs checkout, so folding the three former jobs (secret scan,
# action-pinning, SECURITY.md) into one cuts ~2 billable minutes per call.
# The advisory checks (warning-only) run first so they always emit, even when the
# secret scan below exits non-zero and stops the job on a finding.
jobs:
  scan:
    name: Security scan
    # A plain label, or a JSON array of labels (see the runner input).
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    # Bound, because the default is 360 minutes. This workflow is reusable,
    # so one wedged job spends a caller's quota, not ours.
    # 2.5x the worst of five observed runs (27s), rounded up: GitHub
    # counts whole minutes, so sub-minute maths lands at the floor.
    timeout-minutes: 2
    permissions:
      contents: read
      packages: read   # pull the pinned scanner image from GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check action version pinning
        run: |
          UNPINNED=0
          while IFS= read -r file; do
            n=0
            while IFS= read -r line; do
              n=$((n + 1))
              if echo "$line" | grep -qE '^\s+uses:\s+\S+@(v[0-9]|main|master|latest)'; then
                echo "::warning file=$file,line=$n::Unpinned action. Pin to a full commit SHA for supply-chain safety."
                UNPINNED=$((UNPINNED + 1))
              fi
            done < "$file"
          done < <(find .github/workflows -name '*.yml' -o -name '*.yaml' 2>/dev/null)
          if [ "$UNPINNED" -gt 0 ]; then
            echo "::warning::$UNPINNED unpinned action(s) found. Pin to a full commit SHA for supply-chain safety."
          else
            echo "All actions are pinned or no workflows found."
          fi

      - name: Check SHA pins carry no dated comment
        # Dependabot rewrites a trailing version comment only when the ref is a tag.
        # Beside a commit SHA there is no version to write, so a date put there is never
        # updated: it goes stale on the next bump and then stays stale, because nothing
        # reads it. Measured, not hypothetical. Nine repos in this account carried dates
        # up to 43 days wrong, and three of them labelled the SAME commit with three
        # different dates. The SHA is the record; resolve it if you need to date a pin.
        #
        # A warning rather than a failure, matching the pinning check above. This is
        # stale prose, not a security defect, and a reusable workflow should not fail a
        # caller's build over a comment. Callers see it when their pin to this workflow
        # next moves, so the rollout is gradual by construction.
        run: |
          DATED=0
          while IFS= read -r file; do
            n=0
            while IFS= read -r line; do
              n=$((n + 1))
              if echo "$line" | grep -qE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+[^[:space:]]+@[0-9a-f]{40}[[:space:]]*#.*@[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}'; then
                echo "::warning file=$file,line=$n::Dated comment beside a SHA pin, which nothing keeps current. Drop the date; the SHA is the record."
                DATED=$((DATED + 1))
              fi
            done < "$file"
          done < <(find .github/workflows -name '*.yml' -o -name '*.yaml' 2>/dev/null)
          if [ "$DATED" -gt 0 ]; then
            echo "::warning::$DATED SHA pin(s) carry a date comment. Drop the date; the SHA is the record."
          else
            echo "No dated comments beside SHA pins."
          fi

      - name: Check SECURITY.md exists
        run: |
          if [ -f SECURITY.md ] || [ -f .github/SECURITY.md ]; then
            echo "SECURITY.md found."
          else
            echo "::warning::SECURITY.md is missing. Add one to define your vulnerability disclosure process."
          fi

      - name: Secret scan skipped by the caller
        if: ${{ !inputs.secret-scan }}
        run: |
          echo "::notice::Secret scan skipped (secret-scan: false). The caller is responsible for an equivalent scan."
          echo "## Secret scan (betterleaks): skipped by the caller (\`secret-scan: false\`)" >> "$GITHUB_STEP_SUMMARY"

      # Keep the GHCR login out of ~/.docker. A hosted runner is discarded after the job, but
      # on a self-hosted runner ~/.docker outlives it, and a token written there is a credential
      # left behind on the machine. The runner empties RUNNER_TEMP at the start and end of
      # every job.
      - name: Keep registry credentials in the job's temp dir
        if: ${{ inputs.secret-scan }}
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Log in to GHCR (to pull the pinned image)
        if: ${{ inputs.secret-scan }}
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Secret scan via the pinned toolbox image
        if: ${{ inputs.secret-scan }}
        env:
          # Pinned by digest, not :latest. A rebuild of the toolbox used to change
          # what every caller scanned with, without any caller changing a line --
          # betterleaks 1.6.1 -> 1.8.1 (#64) added the generic-password and
          # generic-credential-uri rules and turned green repos red overnight.
          # Bump this deliberately, alongside toolbox/tools.lock.
          IMAGE: ghcr.io/garymike/security-workflows/security-toolbox-base@sha256:5337fb0a3ca4be3e933ec2c5ef9ecc50506f2b0b9db05c29969393722986d000
          FAIL: ${{ inputs.fail-on-findings }}
        run: |
          set -uo pipefail
          docker pull "$IMAGE"
          # Scan "." rather than "/src". betterleaks derives finding fingerprints
          # from the scan root as given, so an absolute root yields absolute
          # fingerprints (/src/path/file.yml:rule:12). Those can never match a
          # committed .gitleaksignore, which is written relative to the repo
          # root -- so with an absolute root the ignore file silently does
          # nothing for every caller. The working directory is already /src.
          # --verbose prints rule, path, line and a redacted excerpt, so a
          # failure says what to look at. --redact keeps values out of the log.
          #
          # The output is tee'd so the count can reach the job summary, where a
          # reviewer sees it without opening the log. Only the count goes there:
          # no rule, path or excerpt, and nothing is kept as an artifact, because a
          # secret-scan report on a public repo's run page is a map of where to look.
          # pipefail makes rc betterleaks's own exit code, not tee's.
          report="$RUNNER_TEMP/betterleaks.txt"
          rc=0
          docker run --rm -v "$PWD:/src:ro" -w /src "$IMAGE"                betterleaks dir . --no-banner --redact --verbose 2>&1 | tee "$report" || rc=$?
          # betterleaks ends with a log line "<time> WRN leaks found: N" (exit 1) or
          # "<time> INF no leaks found" (exit 0). Its report echoes excerpts of the
          # scanned files, which a fork PR controls, so the match is anchored to that
          # whole log line; excerpt lines start with box-drawing characters and cannot
          # match. A non-zero exit with no such line is reported as unknown, not 0.
          count=$(sed 's/\x1b\[[0-9;]*m//g' "$report" | grep -E '^[0-9]{1,2}:[0-9]{2}(AM|PM) WRN leaks found: [0-9]+$' | tail -1 | grep -oE '[0-9]+$' || true)
          if [ "$rc" -eq 0 ]; then count=0; fi
          if [ "$rc" -ne 0 ] && [ "$count" = 0 ]; then count=""; fi
          {
            if [ -n "$count" ]; then
              echo "## Secret scan (betterleaks): $count potential secret$([ "$count" = 1 ] || echo s)"
            else
              echo "## Secret scan (betterleaks): did not complete (exit $rc)"
              echo ""
              echo "No count could be read from its output; see the job log."
            fi
            if [ "$rc" -ne 0 ]; then
              echo ""
              echo "Details are in the job log, redacted. A false positive goes in \`.gitleaksignore\` in this repo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "betterleaks: no secrets found."
          else
            echo "::error::betterleaks reported ${count:-an unknown number of} potential secret(s). Review the findings above; if one is a false positive, add its fingerprint to .gitleaksignore in the caller repo."
            if [ "$FAIL" = "true" ]; then exit 1; fi
            echo "::warning::continuing (fail-on-findings=false)."
          fi
