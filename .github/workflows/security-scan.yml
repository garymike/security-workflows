name: Security scan (reusable)

on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: 'Fail the workflow if secrets are detected (false = warn only)'
        type: boolean
        default: true

permissions:
  contents: read

# A single job with sequential steps. Each job on a private repo bills a 1-minute
# floor and re-runs checkout, so folding the three former jobs (secret scan,
# action-pinning, SECURITY.md) into one cuts ~2 billable minutes per call.
# The advisory checks (warning-only) run first so they always emit, even when the
# secret scan below exits non-zero and stops the job on a finding.
jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes. This workflow is reusable,
    # so one wedged job spends a caller's quota, not ours.
    # 2.5x the worst of five observed runs (27s), rounded up: GitHub
    # counts whole minutes, so sub-minute maths lands at the floor.
    timeout-minutes: 2
    permissions:
      contents: read
      packages: read   # pull the pinned scanner image from GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check action version pinning
        run: |
          UNPINNED=0
          while IFS= read -r file; do
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^\s+uses:\s+\S+@(v[0-9]|main|master|latest)'; then
                echo "::warning file=$file::Unpinned action: $(echo "$line" | xargs)"
                UNPINNED=$((UNPINNED + 1))
              fi
            done < "$file"
          done < <(find .github/workflows -name '*.yml' -o -name '*.yaml' 2>/dev/null)
          if [ "$UNPINNED" -gt 0 ]; then
            echo "::warning::$UNPINNED unpinned action(s) found. Pin to a full commit SHA for supply-chain safety."
          else
            echo "All actions are pinned or no workflows found."
          fi

      - name: Check SECURITY.md exists
        run: |
          if [ -f SECURITY.md ] || [ -f .github/SECURITY.md ]; then
            echo "SECURITY.md found."
          else
            echo "::warning::SECURITY.md is missing. Add one to define your vulnerability disclosure process."
          fi

      - name: Log in to GHCR (to pull the pinned image)
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Secret scan via the pinned toolbox image
        env:
          # Pinned by digest, not :latest. A rebuild of the toolbox used to change
          # what every caller scanned with, without any caller changing a line --
          # betterleaks 1.6.1 -> 1.8.1 (#64) added the generic-password and
          # generic-credential-uri rules and turned green repos red overnight.
          # Bump this deliberately, alongside toolbox/tools.lock.
          IMAGE: ghcr.io/garymike/security-workflows/security-toolbox-base@sha256:5614f8b901b9eaaed08dff70ece757ebf17a1e14693246299de63f90e6fe89b1
          FAIL: ${{ inputs.fail-on-findings }}
        run: |
          set -uo pipefail
          docker pull "$IMAGE"
          # Scan "." rather than "/src". betterleaks derives finding fingerprints
          # from the scan root as given, so an absolute root yields absolute
          # fingerprints (/src/path/file.yml:rule:12). Those can never match a
          # committed .gitleaksignore, which is written relative to the repo
          # root -- so with an absolute root the ignore file silently does
          # nothing for every caller. The working directory is already /src.
          # --verbose prints rule, path, line and a redacted excerpt, so a
          # failure says what to look at. --redact keeps values out of the log.
          if docker run --rm -v "$PWD:/src:ro" -w /src "$IMAGE"                betterleaks dir . --no-banner --redact --verbose; then
            echo "betterleaks: no secrets found."
          else
            echo "::error::betterleaks reported potential secrets. Review the findings above; if one is a false positive, add its fingerprint to .gitleaksignore in the caller repo."
            if [ "$FAIL" = "true" ]; then exit 1; fi
            echo "::warning::continuing (fail-on-findings=false)."
          fi
