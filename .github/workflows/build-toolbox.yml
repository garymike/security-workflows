name: Build toolbox images

on:
  push:
    branches: [main]
    paths:
      - 'toolbox/**'
      - '.github/workflows/build-toolbox.yml'
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC — rebuild to pick up base-image patches
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    name: Build, sign, push — security-toolbox-base
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes — one wedged job would
    # spend 18% of a monthly free tier before anyone looked.
    # 2.5x the worst of five observed runs (168s).
    timeout-minutes: 7
    permissions:
      contents: read
      packages: write   # push image to GHCR
      id-token: write   # cosign keyless signing + build provenance
    outputs:
      image: ${{ steps.prep.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: prep
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/security-toolbox-base"
          {
            echo "image=$IMAGE"
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${GITHUB_SHA::12}"
            echo "$IMAGE:$(date -u +%Y%m%d)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for CVE scan (local, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./toolbox/base
          load: true
          tags: security-toolbox-base:scan

      - name: Scan image for fixable CRITICAL CVEs (Trivy) — publish gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: security-toolbox-base:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          # CVE-2026-56854 (golang.org/x/crypto/ssh) is not reachable here: the images run no
          # SSH server. Scoped to the two binaries that cannot yet be fixed; see the document.
          TRIVY_VEX: ${{ github.workspace }}/.trivy/toolbox.openvex.json

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./toolbox/base
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, Sigstore/OIDC)
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # A rebuild whose inputs did not change produces a byte-identical digest, and Rekor
        # rejects a second equivalent entry for it with 409 createLogEntryConflict. That is not a
        # signing failure: the entry it conflicts with IS this digest's signature, already in the
        # log from the earlier run. #86's build went red on exactly that, because toolbox/gha was
        # unchanged, and a red domain arm then skipped the pins job below, so a reproducible
        # rebuild could silence the very check that watches the pins.
        #
        # Matched on createLogEntryConflict specifically rather than on any non-zero exit, so a
        # real signing failure (no OIDC token, registry refusal, Fulcio down) still fails the step.
        run: |
          if out="$(cosign sign --yes "${IMAGE}@${DIGEST}" 2>&1)"; then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'createLogEntryConflict'; then
            echo "::notice::${IMAGE}@${DIGEST} is already in the transparency log (Rekor 409). The rebuild was reproducible, so the existing entry is this image's own signature."
            exit 0
          fi
          exit 1

      # Hand the digest to the `pins` job. steps.build.outputs.digest is the authority, not the
      # registry: a `latest` index carrying attestations reports a different digest than the image
      # manifest, and reading it off a local pull is how two of five pins went in wrong in #82.
      - name: Record the digest that was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s %s\n' security-toolbox-base "$DIGEST" > digests/security-toolbox-base.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-digest-security-toolbox-base
          path: digests/
          retention-days: 1

  domain:
    name: Build, sign, push — ${{ matrix.image }}
    needs: base
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes — one wedged job would
    # spend 18% of a monthly free tier before anyone looked.
    # 2.5x the worst across the matrix (330s, skill-audit-toolbox).
    # Sized for the slowest arm rather than the average of five.
    timeout-minutes: 14
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcp-review-toolbox
            context: ./toolbox/mcp-review
          - image: gha-toolbox
            context: ./toolbox/gha
          - image: skill-audit-toolbox
            context: ./toolbox/skill-audit
          - image: sast-toolbox
            context: ./toolbox/sast
          - image: iac-toolbox
            context: ./toolbox/iac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: prep
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}"
          {
            echo "image=$IMAGE"
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${GITHUB_SHA::12}"
            echo "$IMAGE:$(date -u +%Y%m%d)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for CVE scan (local, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          build-args: |
            BASE=${{ needs.base.outputs.image }}@${{ needs.base.outputs.digest }}
          tags: ${{ matrix.image }}:scan

      - name: Scan image for fixable CRITICAL CVEs (Trivy) — publish gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          # CVE-2026-56854 (golang.org/x/crypto/ssh) is not reachable here: the images run no
          # SSH server. Scoped to the two binaries that cannot yet be fixed; see the document.
          TRIVY_VEX: ${{ github.workspace }}/.trivy/toolbox.openvex.json

      - name: Build and push (pinned to the signed base by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            BASE=${{ needs.base.outputs.image }}@${{ needs.base.outputs.digest }}
          tags: ${{ steps.prep.outputs.tags }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, Sigstore/OIDC)
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # A rebuild whose inputs did not change produces a byte-identical digest, and Rekor
        # rejects a second equivalent entry for it with 409 createLogEntryConflict. That is not a
        # signing failure: the entry it conflicts with IS this digest's signature, already in the
        # log from the earlier run. #86's build went red on exactly that, because toolbox/gha was
        # unchanged, and a red domain arm then skipped the pins job below, so a reproducible
        # rebuild could silence the very check that watches the pins.
        #
        # Matched on createLogEntryConflict specifically rather than on any non-zero exit, so a
        # real signing failure (no OIDC token, registry refusal, Fulcio down) still fails the step.
        run: |
          if out="$(cosign sign --yes "${IMAGE}@${DIGEST}" 2>&1)"; then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'createLogEntryConflict'; then
            echo "::notice::${IMAGE}@${DIGEST} is already in the transparency log (Rekor 409). The rebuild was reproducible, so the existing entry is this image's own signature."
            exit 0
          fi
          exit 1

      - name: Record the digest that was published
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s %s\n' "$IMAGE_NAME" "$DIGEST" > "digests/${IMAGE_NAME}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-digest-${{ matrix.image }}
          path: digests/
          retention-days: 1

  pins:
    name: Reusable-workflow image pins match what was published
    needs: [base, domain]
    # Runs even when an arm of the build failed. Without this, one red domain arm skips the check
    # entirely, which is how #86 published five images with nobody comparing the pins. An image
    # that did not publish is reported as not checked rather than counted as current.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    # The five reusable workflows pin their toolbox image by digest, and #73 made that pin
    # deliberate on purpose: a rebuild must not silently change what every caller scans with, after
    # betterleaks 1.6.1 -> 1.8.1 in #64 turned green repos red overnight. The cost of "deliberate"
    # is that nothing moves it for you, and nothing reminded anyone either. #80 bumped eight tools
    # and #81 bumped SkillSpector, both published, and neither moved the pins, so callers kept
    # getting the previous toolchain while tools.lock claimed otherwise. #82 was the cleanup, and
    # the pins have gone stale again on every toolbox/** change since.
    #
    # So this compares each pin against the digest this run actually published. It is a SEPARATE
    # job, after base and domain, on purpose: publishing must never be blocked by a stale pin,
    # because the digest to pin does not exist until the publish has happened. The images ship and
    # the run still goes red, so the follow-up is not optional. Red here means the pins are behind,
    # not that anything is broken, which is the same contract as tool-drift.yml.
    #
    # Deliberately not a registry lookup. Comparing against the `latest` index digest false-reds on
    # images whose index carries attestations, which is why the equivalent check was pulled back out
    # of check-tool-updates.sh in #82. The build already holds both halves.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-digest-*
          merge-multiple: true
          path: digests

      - name: Compare each pin with the digest published in this run
        run: |
          set -uo pipefail
          # mcp-review-toolbox is built here but no reusable workflow pins it, so it is reported as
          # unpinned rather than counted as a mismatch.
          wf_for() {
            case "$1" in
              security-toolbox-base) echo security-scan ;;
              gha-toolbox)           echo gha-security ;;
              sast-toolbox)          echo sast ;;
              iac-toolbox)           echo iac-security ;;
              skill-audit-toolbox)   echo skill-audit ;;
              *)                     echo "" ;;
            esac
          }

          ls digests/*.txt >/dev/null 2>&1 || { echo "::error::no digest files were produced, so the pins were NOT verified"; exit 1; }

          # Every image this workflow publishes. A missing digest file means that arm did not get
          # as far as publishing, so there is nothing to compare: say so loudly instead of letting
          # a short list read as a clean sweep.
          for expected in security-toolbox-base gha-toolbox sast-toolbox iac-toolbox skill-audit-toolbox mcp-review-toolbox; do
            [ -f "digests/${expected}.txt" ] || echo "::warning::${expected} published no digest in this run, so its pin was NOT checked."
          done

          stale=0
          {
            echo "| image | workflow | pinned | published | |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for file in digests/*.txt; do
            read -r image published < "$file"
            wf="$(wf_for "$image")"
            if [ -z "$wf" ]; then
              echo "  ${image}: built here, not pinned by a reusable workflow (skipped)"
              echo "| ${image} | none | - | $(printf %.12s "${published#sha256:}") | not pinned |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            path=".github/workflows/${wf}.yml"
            pinned="$(sed -n "s|.*${image}@\(sha256:[0-9a-f]\{64\}\).*|\1|p" "$path" | head -1)"
            if [ -z "$pinned" ]; then
              echo "::error::${wf}.yml has no ${image} digest pin to compare against"
              stale=1
            elif [ "$pinned" != "$published" ]; then
              echo "::error::${wf}.yml pins ${image}@${pinned#sha256:} but this run published ${published#sha256:}. Move the pin alongside toolbox/tools.lock, per the comment in that workflow."
              echo "| ${image} | ${wf}.yml | $(printf %.12s "${pinned#sha256:}") | $(printf %.12s "${published#sha256:}") | **behind** |" >> "$GITHUB_STEP_SUMMARY"
              stale=1
            else
              echo "  ${wf}.yml: ${image} pin is current"
              echo "| ${image} | ${wf}.yml | $(printf %.12s "${pinned#sha256:}") | $(printf %.12s "${published#sha256:}") | current |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$stale" -ne 0 ]; then
            {
              echo ""
              echo "### Pins are behind"
              echo ""
              echo "The images above published fine. What is missing is the second half of the change:"
              echo "move the digest pins in the reusable workflows to what this run built, in their own"
              echo "commit. The digest does not exist until the publish has happened, which is why this"
              echo "is always a follow-up rather than part of the bump."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All reusable-workflow image pins match what this run published."
