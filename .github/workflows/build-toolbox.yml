name: Build toolbox images

on:
  push:
    branches: [main]
    paths:
      - 'toolbox/**'
      - '.github/workflows/build-toolbox.yml'
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC — rebuild to pick up base-image patches
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    name: Build, sign, push — security-toolbox-base
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes — one wedged job would
    # spend 18% of a monthly free tier before anyone looked.
    # 2.5x the worst of five observed runs (168s).
    timeout-minutes: 7
    permissions:
      contents: read
      packages: write   # push image to GHCR
      id-token: write   # cosign keyless signing + build provenance
    outputs:
      image: ${{ steps.prep.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: prep
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/security-toolbox-base"
          # Fingerprint of this repo's tracked build inputs for this image, stamped onto the
          # image below as a label so scripts/check-image-pins.py can ask a PINNED image
          # which inputs it came from. `git ls-files -s` prints mode, blob sha and path in a
          # stable order, so this moves only when a tracked input moves. The image digest
          # does not have that property: the Dockerfiles apt-get install current packages, so
          # every rebuild publishes a new digest. Keep these paths in step with PINNED there.
          STAMP="$(git ls-files -s -- toolbox/base toolbox/tools.lock | sha256sum | cut -d" " -f1)"
          {
            echo "image=$IMAGE"
            echo "stamp=$STAMP"
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${GITHUB_SHA::12}"
            echo "$IMAGE:$(date -u +%Y%m%d)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for CVE scan (local, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./toolbox/base
          load: true
          tags: security-toolbox-base:scan

      - name: Scan image for fixable CRITICAL CVEs (Trivy) — publish gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: security-toolbox-base:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          # CVE-2026-56854 (golang.org/x/crypto/ssh) is not reachable here: the images run no
          # SSH server. Scoped to the two binaries that cannot yet be fixed; see the document.
          TRIVY_VEX: ${{ github.workspace }}/.trivy/toolbox.openvex.json

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./toolbox/base
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          labels: io.github.garymike.toolbox.build-inputs=${{ steps.prep.outputs.stamp }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, Sigstore/OIDC)
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Rekor rejects a second equivalent entry for a digest with 409 createLogEntryConflict.
        # That is not a signing failure: the entry it conflicts with IS this digest's signature,
        # already in the log from an earlier run, which happens when a rebuild lands on a digest
        # that was published before. #86's build went red on exactly that.
        #
        # It is not the common case, and an earlier version of this comment had it backwards.
        # These Dockerfiles apt-get install current packages, so a rebuild days apart publishes
        # a NEW digest and cannot conflict; only a rebuild close enough to hit the buildx cache
        # comes out identical. #88's pins job was designed on the wrong half of that and failed
        # on every run it ever had. That check now compares build inputs instead, in
        # scripts/check-image-pins.py.
        #
        # Matched on createLogEntryConflict specifically rather than on any non-zero exit, so a
        # real signing failure (no OIDC token, registry refusal, Fulcio down) still fails the step.
        run: |
          if out="$(cosign sign --yes "${IMAGE}@${DIGEST}" 2>&1)"; then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'createLogEntryConflict'; then
            echo "::notice::${IMAGE}@${DIGEST} is already in the transparency log (Rekor 409). The rebuild was reproducible, so the existing entry is this image's own signature."
            exit 0
          fi
          exit 1

      # steps.build.outputs.digest is the authority, not the registry: a `latest` index
      # carrying attestations reports a different digest than the image manifest, and reading
      # it off a local pull is how two of five pins went in wrong in #82. Printed because
      # moving a pin is a follow-up commit, and this is the number that follow-up needs.

      - name: Report the digest to pin
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          STAMP: ${{ steps.prep.outputs.stamp }}
        run: |
          {
            echo "### Published"
            echo ""
            echo "- \`${IMAGE}@${DIGEST}\`"
            echo "- built from inputs \`${STAMP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::published ${IMAGE}@${DIGEST}"

  domain:
    name: Build, sign, push — ${{ matrix.image }}
    needs: base
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes — one wedged job would
    # spend 18% of a monthly free tier before anyone looked.
    # 2.5x the worst across the matrix (330s, skill-audit-toolbox).
    # Sized for the slowest arm rather than the average of five.
    timeout-minutes: 14
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcp-review-toolbox
            context: ./toolbox/mcp-review
          - image: gha-toolbox
            context: ./toolbox/gha
          - image: skill-audit-toolbox
            context: ./toolbox/skill-audit
          - image: sast-toolbox
            context: ./toolbox/sast
          - image: iac-toolbox
            context: ./toolbox/iac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: prep
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}"
          # Fingerprint of this repo's tracked build inputs for this image, stamped onto the
          # image below as a label so scripts/check-image-pins.py can ask a PINNED image
          # which inputs it came from. `git ls-files -s` prints mode, blob sha and path in a
          # stable order, so this moves only when a tracked input moves. The image digest
          # does not have that property: the Dockerfiles apt-get install current packages, so
          # every rebuild publishes a new digest. Keep these paths in step with PINNED there.
          # toolbox/base is an input to every domain image, because each one is built
          # FROM the base by digest in the push step below.
          CTX="${{ matrix.context }}"
          STAMP="$(git ls-files -s -- toolbox/base "${CTX#./}" toolbox/tools.lock | sha256sum | cut -d" " -f1)"
          {
            echo "image=$IMAGE"
            echo "stamp=$STAMP"
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${GITHUB_SHA::12}"
            echo "$IMAGE:$(date -u +%Y%m%d)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for CVE scan (local, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          build-args: |
            BASE=${{ needs.base.outputs.image }}@${{ needs.base.outputs.digest }}
          tags: ${{ matrix.image }}:scan

      - name: Scan image for fixable CRITICAL CVEs (Trivy) — publish gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          # CVE-2026-56854 (golang.org/x/crypto/ssh) is not reachable here: the images run no
          # SSH server. Scoped to the two binaries that cannot yet be fixed; see the document.
          TRIVY_VEX: ${{ github.workspace }}/.trivy/toolbox.openvex.json

      - name: Build and push (pinned to the signed base by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            BASE=${{ needs.base.outputs.image }}@${{ needs.base.outputs.digest }}
          tags: ${{ steps.prep.outputs.tags }}
          labels: io.github.garymike.toolbox.build-inputs=${{ steps.prep.outputs.stamp }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, Sigstore/OIDC)
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Rekor rejects a second equivalent entry for a digest with 409 createLogEntryConflict.
        # That is not a signing failure: the entry it conflicts with IS this digest's signature,
        # already in the log from an earlier run, which happens when a rebuild lands on a digest
        # that was published before. #86's build went red on exactly that.
        #
        # It is not the common case, and an earlier version of this comment had it backwards.
        # These Dockerfiles apt-get install current packages, so a rebuild days apart publishes
        # a NEW digest and cannot conflict; only a rebuild close enough to hit the buildx cache
        # comes out identical. #88's pins job was designed on the wrong half of that and failed
        # on every run it ever had. That check now compares build inputs instead, in
        # scripts/check-image-pins.py.
        #
        # Matched on createLogEntryConflict specifically rather than on any non-zero exit, so a
        # real signing failure (no OIDC token, registry refusal, Fulcio down) still fails the step.
        run: |
          if out="$(cosign sign --yes "${IMAGE}@${DIGEST}" 2>&1)"; then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'createLogEntryConflict'; then
            echo "::notice::${IMAGE}@${DIGEST} is already in the transparency log (Rekor 409). The rebuild was reproducible, so the existing entry is this image's own signature."
            exit 0
          fi
          exit 1

      - name: Report the digest to pin
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          STAMP: ${{ steps.prep.outputs.stamp }}
        run: |
          {
            echo "### Published"
            echo ""
            echo "- \`${IMAGE}@${DIGEST}\`"
            echo "- built from inputs \`${STAMP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::published ${IMAGE}@${DIGEST}"
