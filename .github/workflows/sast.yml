name: SAST (reusable)

# Static application security testing with the pinned sast-toolbox image (Semgrep OSS).
# Emits SARIF and uploads it to GitHub code scanning. Universal/portable SAST — pair with
# codeql.yml (deep engine, public repos) for defense-in-depth.

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to scan (default: repo root)'
        type: string
        default: '.'
      config:
        description: 'Semgrep configs, space-separated (registry packs like p/default, or paths). Add LLM packs here.'
        type: string
        default: 'p/default'
      fail-on-findings:
        description: 'Fail the job on Semgrep findings (false = warn only)'
        type: boolean
        default: false
      upload-sarif:
        description: 'Upload results to GitHub code scanning'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes. This workflow is reusable,
    # so one wedged job spends a caller's quota, not ours.
    # 2.5x the worst of five observed runs (32s), rounded up.
    timeout-minutes: 2
    permissions:
      contents: read
      packages: read          # pull the pinned scanner image from GHCR
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR (to pull the pinned image)
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Semgrep scan
        id: semgrep
        env:
          # Pinned by digest, not :latest, to match security-scan.yml. A toolbox
          # rebuild otherwise changes what every caller scans with, without any
          # caller changing a line. Bump deliberately, alongside toolbox/tools.lock.
          IMAGE: ghcr.io/garymike/security-workflows/sast-toolbox@sha256:f3f951735d140a0e3bfc79c75e97bcfed9e8deec382282d383678071987cd505
          SCAN_PATH: ${{ inputs.path }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -uo pipefail
          docker pull "$IMAGE"
          mkdir -p out
          read -ra packs <<< "$CONFIG"
          cfg=()
          for c in "${packs[@]}"; do cfg+=(--config "$c"); done
          rc=0
          # SARIF to stdout, redirected on the host (avoids container-uid write perms).
          docker run --rm -v "$PWD:/src:ro" -w /src "$IMAGE" \
            semgrep scan "${cfg[@]}" "/src/$SCAN_PATH" --sarif --metrics=off > out/semgrep.sarif || rc=$?
          sarif=false; [ -s out/semgrep.sarif ] && sarif=true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
          if [ "$rc" -gt 1 ]; then echo "::error::semgrep errored (rc=$rc)"; exit "$rc"; fi
          echo "semgrep finished (rc=$rc; 1 = findings, 0 = clean)"

      - name: Drop suppressed results from the SARIF
        # Semgrep honours an inline `# nosemgrep: <rule-id>` when it scans, but still writes
        # the finding into the SARIF, as a result carrying `suppressions: [{"state":
        # "accepted"}]`. GitHub code scanning does not honour SARIF suppressions, so the
        # alert is re-asserted on every upload: the two dynamic-urllib-use-detected findings
        # in scripts/ stayed open through the commit that added the nosemgrep, anchored on
        # the exact lines carrying it. Same mechanism and same fix as iac-security.yml's
        # Checkov step: remove suppressed results here, so an inline ignore means in code
        # scanning what it means in Semgrep.
        if: ${{ steps.semgrep.outputs.sarif == 'true' }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "out/semgrep.sarif"
          with open(path, encoding="utf-8") as handle:
              doc = json.load(handle)
          dropped = 0
          for run in doc.get("runs", []):
              results = run.get("results", [])
              kept = [r for r in results if not r.get("suppressions")]
              dropped += len(results) - len(kept)
              run["results"] = kept
          with open(path + ".tmp", "w", encoding="utf-8") as handle:
              json.dump(doc, handle)
          os.replace(path + ".tmp", path)
          print(f"dropped {dropped} suppressed result(s) from {path}")
          PY

      - name: Upload SARIF to code scanning
        if: ${{ inputs.upload-sarif && steps.semgrep.outputs.sarif == 'true' }}
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: out/semgrep.sarif
          category: semgrep

      - name: Enforce fail-on-findings
        if: ${{ inputs.fail-on-findings && steps.semgrep.outputs.rc == '1' }}
        run: |
          echo "::error::Semgrep reported findings (fail-on-findings=true)."
          exit 1
