name: Self scan

# Dogfoods our own REUSABLE workflows against this repo, so that changes to them (parse
# errors, invalid permissions, runtime failures) are caught here on every push/PR — the
# gap that let the v0.4.0/v0.4.1 bugs ship. CodeQL is omitted (this repo has no
# CodeQL-supported languages). These pull the last-published images; the dogfood job builds
# and blocking-lints the images and workflows themselves.
#
# No `secrets: inherit` — the reusable workflows only use the automatic GITHUB_TOKEN.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (rapid pushes / PR updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/security-scan.yml
    with:
      fail-on-findings: true

  gha-security:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/gha-security.yml
    with:
      # The JSON-array form of the runner input, resolving to the same hosted runner as the
      # default. Every other job here uses the plain-label default, so both paths run on each PR.
      runner: '["ubuntu-latest"]'

  sast:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/sast.yml

  iac-security:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/iac-security.yml

  skill-audit:
    permissions:
      contents: read
      packages: read
      security-events: write   # gate uploads SARIF to code scanning
    uses: ./.github/workflows/skill-audit.yml

  security-audit:
    permissions:
      contents: read
    uses: ./.github/workflows/security-audit.yml

  # Input proofs: the non-default paths of the opt-out inputs, so a change that breaks one of
  # them fails here rather than in the first caller to pass it. Coverage comes from the jobs
  # above; these only prove the inputs run.
  security-scan-no-secret-scan:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/security-scan.yml
    with:
      secret-scan: false

  iac-security-skip-frameworks:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/iac-security.yml
    with:
      # The space is deliberate: it proves whitespace is dropped. A name Checkov rejected would
      # fail the job (exit without SARIF), so a green run means Checkov accepted the list.
      skip-frameworks: 'kubernetes, helm'
      # Off so this run's SARIF never replaces the iac-security job's in code scanning.
      upload-sarif: false
