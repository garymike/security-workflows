name: Tool bump

# Tool drift is detected weekly but was cleared by hand, and the pins move faster
# than that: in the week of 2026-09-14 four of eleven drifted, two of them twice.
# A gate that is red most Mondays regardless of how promptly anyone acts is the
# same cry-wolf signal tool-drift.yml was split out to avoid, one level up.
#
# So this opens the bump PR instead. It applies patch and minor bumps only, proves
# them by building every image before proposing anything, and leaves majors and
# the SkillSpector commit pin to a human with a changelog. Merging stays manual —
# this removes the typing, not the review.
#
# Runs before build (06:00) and the drift gate (08:00) so a merged PR is picked up
# the same morning.

on:
  schedule:
    - cron: '0 5 * * 1'   # weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# One bump branch at a time; a second run would race the force-push.
concurrency:
  group: tool-bump
  cancel-in-progress: false

env:
  BRANCH: automated/tool-bumps

jobs:
  bump:
    name: Detect drift, validate, open PR
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes. Six image builds against the
    # worst observed build-toolbox arm (330s) plus headroom for a cold cache.
    timeout-minutes: 25
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open or update the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credentials on disk: the validation step below runs `docker build`,
          # which executes upstream installers for ten third-party tools. Those
          # must never find a pushable token in .git/config. The push step at the
          # end supplies one through the environment instead, after the builds.
          persist-credentials: false

      - name: Detect drift
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Advisory mode: a drifted pin is the input to this workflow, not a failure.
          bash scripts/check-tool-updates.sh --emit-drift drift.tsv
          if [ -s drift.tsv ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Drift rows:"; cat drift.tsv
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No drift — nothing to propose."
          fi

      - name: Apply patch/minor bumps
        id: apply
        if: steps.drift.outputs.found == 'true'
        run: |
          python3 scripts/apply-tool-bumps.py drift.tsv . | tee bump-summary.md
          cat bump-summary.md >> "$GITHUB_STEP_SUMMARY"
          # A drift row that is all majors or all unresolvable leaves the tree clean.
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing auto-bumpable (majors and commit pins are left to a human)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # The real gate. A version that does not exist, or whose published checksum
      # does not match, fails here and no PR is ever opened. build-push-action is
      # not used: nothing is pushed or signed, and a plain build keeps this off the
      # publish path entirely.
      - name: Validate — build base
        if: steps.apply.outputs.changed == 'true'
        run: docker build -t security-toolbox-base:bump ./toolbox/base

      - name: Validate — build domain images
        if: steps.apply.outputs.changed == 'true'
        run: |
          for ctx in mcp-review gha skill-audit sast iac; do
            echo "::group::build $ctx"
            docker build --build-arg BASE=security-toolbox-base:bump -t "$ctx-toolbox:bump" "./toolbox/$ctx"
            echo "::endgroup::"
          done

      - name: Push branch and open PR
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add toolbox/
          git commit -m "chore(toolbox): bump pinned tools to clear the drift gate"

          # Force-push a single long-lived branch so consecutive weeks update one PR
          # rather than stacking a new one every Monday.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

          {
            echo "Opened automatically by \`.github/workflows/tool-bump.yml\`."
            echo ""
            cat bump-summary.md
            echo ""
            echo "Every image was built from these pins before this PR was opened, so"
            echo "each version resolves and its published checksum verifies. Majors and"
            echo "the SkillSpector commit pin are deliberately excluded — bump those by"
            echo "hand against the upstream changelog."
            echo ""
            echo "Note: this PR is created with \`GITHUB_TOKEN\`, so GitHub does not start"
            echo "the usual PR checks on it. The build above is the gate."
          } > pr-body.md

          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file pr-body.md
            echo "Updated the existing PR."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(toolbox): bump pinned tools to clear the drift gate" \
              --body-file pr-body.md
          fi
