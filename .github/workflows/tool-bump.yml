name: Tool bump

# Tool drift is detected weekly but was cleared by hand, and the pins move faster
# than that: in the week of 2026-09-14 four of eleven drifted, two of them twice.
# A gate that is red most Mondays regardless of how promptly anyone acts is the
# same cry-wolf signal tool-drift.yml was split out to avoid, one level up.
#
# So this prepares the bump instead. It applies patch and minor bumps only, proves
# them by building every image, and pushes a ready branch. Majors and the
# SkillSpector commit pin are left to a human with a changelog.
#
# It deliberately does NOT open the PR itself. Doing that needs "Allow GitHub
# Actions to create and approve pull requests", and GitHub does not let you grant
# create without also granting approve — so turning it on would let any workflow in
# this repo approve PRs, which is a poor trade for saving one click in the repo
# that guards everything else. The branch is pushed and the job summary links
# straight to the compare view.
#
# Runs before build (06:00) and the drift gate (08:00) so a merged PR is picked up
# the same morning.

on:
  schedule:
    - cron: '0 5 * * 1'   # weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# One bump branch at a time; a second run would race the force-push.
concurrency:
  group: tool-bump
  cancel-in-progress: false

env:
  BRANCH: automated/tool-bumps

jobs:
  bump:
    name: Detect drift, validate, push branch
    runs-on: ubuntu-latest
    # Bound, because the default is 360 minutes. Six image builds against the
    # worst observed build-toolbox arm (330s) plus headroom for a cold cache.
    # Observed end-to-end on 2026-09-21: 2m20s of builds.
    timeout-minutes: 25
    permissions:
      contents: write   # push the bump branch. No pull-requests scope: see above.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credentials on disk: the validation step below runs `docker build`,
          # which executes upstream installers for ten third-party tools. Those
          # must never find a pushable token in .git/config. The push step at the
          # end supplies one through the environment instead, after the builds.
          persist-credentials: false

      - name: Detect drift
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Advisory mode: a drifted pin is the input to this workflow, not a failure.
          bash scripts/check-tool-updates.sh --emit-drift drift.tsv
          if [ -s drift.tsv ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Drift rows:"; cat drift.tsv
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No drift — nothing to propose."
          fi

      - name: Apply patch/minor bumps
        id: apply
        if: steps.drift.outputs.found == 'true'
        run: |
          python3 scripts/apply-tool-bumps.py drift.tsv . | tee bump-summary.md
          cat bump-summary.md >> "$GITHUB_STEP_SUMMARY"
          # A drift row that is all majors or all unresolvable leaves the tree clean.
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing auto-bumpable (majors and commit pins are left to a human)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # The real gate. A version that does not exist, or whose published checksum
      # does not match, fails here and nothing is ever pushed. build-push-action is
      # not used: nothing is pushed or signed, and a plain build keeps this off the
      # publish path entirely.
      - name: Validate — build base
        if: steps.apply.outputs.changed == 'true'
        run: docker build -t security-toolbox-base:bump ./toolbox/base

      - name: Validate — build domain images
        if: steps.apply.outputs.changed == 'true'
        run: |
          for ctx in mcp-review gha skill-audit sast iac; do
            echo "::group::build $ctx"
            docker build --build-arg BASE=security-toolbox-base:bump -t "$ctx-toolbox:bump" "./toolbox/$ctx"
            echo "::endgroup::"
          done

      - name: Push branch
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add toolbox/
          git commit -m "chore(toolbox): bump pinned tools to clear the drift gate"

          # Force-push a single long-lived branch so consecutive weeks refresh one
          # branch rather than leaving a trail of stale ones.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

          {
            echo ""
            echo "### Ready to open"
            echo ""
            echo "[Open the pull request for \`${BRANCH}\`](https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1)"
            echo ""
            echo "Every image above was built from these pins before the branch was pushed,"
            echo "so each version resolves and its published checksum verifies."
            echo ""
            echo "Opening the PR is manual on purpose — see the comment at the top of"
            echo "\`.github/workflows/tool-bump.yml\`. Opening it yourself also means the"
            echo "normal PR checks run, which a \`GITHUB_TOKEN\`-created PR would skip."
          } >> "$GITHUB_STEP_SUMMARY"
